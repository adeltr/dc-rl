# Catalogue des sites proposés dans la liste déroulante du jumeau.
#
# weather.source :
#   sustaindc_epw  fichier EPW fourni par SustainDC (vendor/sustaindc/data/Weather)
#   public_api     Open-Meteo Archive (ERA5), repli NASA POWER ; mis en cache dans data/weather/
# carbon.source :
#   sustaindc_ci   série horaire 2022 SustainDC (vendor/sustaindc/data/CarbonIntensity/<region>_NG_&_avgCI.csv)
#   owid           facteur annuel pays, Our World in Data energy-data (carbon_intensity_elec)
# sizing_region : clé de la table de dimensionnement du chiller de SustainDC (NY / AZ / WA, sinon 50 °C)
#
# Coordonnées et fuseau des sites EPW : lus dans l'en-tête LOCATION du fichier.

sites:
  - id: us_ny_jfk
    label: New York – JFK (NY, États-Unis)
    country: USA
    weather: {source: sustaindc_epw, file: USA_NY_New.York-Kennedy.epw}
    carbon: {source: sustaindc_ci, region: NY}
    sizing_region: NY
  - id: us_ny_lga
    label: New York – LaGuardia (NY, États-Unis)
    country: USA
    weather: {source: sustaindc_epw, file: USA_NY_New.York-LaGuardia.epw}
    carbon: {source: sustaindc_ci, region: NY}
    sizing_region: NY
